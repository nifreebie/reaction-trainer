app:
  jwt:
    secret: test-test-test-test-test-test-test-test-test-test-test-test-test-test-test-test
    expiration-ms: 86400000
  pair-code:
    length: 6
    ttl-seconds: 120
    pool-size: 5
    cleanup-delay-ms: 60000
    generate-delay-ms: 5000
    min-count: 2

spring:
  datasource:
    url: jdbc:h2:mem:ardodo_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate.hibernate.dialect: org.hibernate.dialect.H2Dialect
